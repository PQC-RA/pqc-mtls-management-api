# publish.yml – build and publish ghcr.io/pqc-ra/pqc-mtls-management-api.
#
# Why this repo and not the gateway: the gateway built this image from a git
# submodule, which made a clean `git clone` of the gateway undeployable. Every
# lab host hid the defect by already having the submodule checked out. The
# deployment plan's target is that each deployable image is built by the repo
# owning its source, with no cross-repo token and no private-submodule checkout.
#
# Native runners per architecture, NOT QEMU. This mirrors the proxy's
# publish.yml, where the same shape took a multi-arch build from a cancelled
# 51-minute QEMU run to 9m20s: one native runner per arch, each pushing BY
# DIGEST, then a merge job stitching a manifest list with `imagetools create`.
name: publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false      # never cancel a half-finished registry push

jobs:
  # GHCR rejects uppercase repository names and this org is "PQC-RA", so resolve
  # the name once here and let every downstream job consume it. The base image
  # digest is resolved here too, so both arches provably build against the same
  # base – reading base.lock independently per runner would not guarantee that
  # if the file changed mid-run.
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.vars.outputs.image }}
      base: ${{ steps.vars.outputs.base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve image name (GHCR requires lowercase) and pinned base
        id: vars
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "image=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"
          base_image=$(jq -er '.image' base.lock)
          base_digest=$(jq -er '.digest' base.lock)
          case "$base_digest" in
            sha256:*) ;;
            *) echo "::error::base.lock digest must be a sha256 digest, got: ${base_digest}"; exit 1 ;;
          esac
          echo "base=${base_image}@${base_digest}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: BASE_OPENSSL_IMAGE=${{ needs.prepare.outputs.base }}
          # Per-arch cache scopes: one shared scope would have the two runners
          # overwrite each other's entries on every build.
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.arch }},mode=max
          # No tag here – the merge job stitches the per-arch digests.
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export per-arch digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download per-arch digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prepare.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          META: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046  # word splitting is intended: one -t per tag
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$META") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Report the published digest
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          BASE: ${{ needs.prepare.outputs.base }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
                     --format '{{json .Manifest.Digest}}' | tr -d '"')
          {
            echo "### Published"
            echo '```'
            echo "image:  ${IMAGE}"
            echo "digest: ${digest}"
            echo "base:   ${BASE}"
            echo '```'
            echo "Pin this digest in the gateway's docker-compose.yml."
          } >> "$GITHUB_STEP_SUMMARY"
