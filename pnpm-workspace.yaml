allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': false
  protobufjs: true
  unrs-resolver: true
# Security floors for transitive dependencies (2026-10-27 audit, pnpm audit --prod),
# each scoped to the affected major so no consumer is moved across a major version.
overrides:
  'proxy-addr@2': '^2.0.8'
  'protobufjs@7': '^7.6.1'
  'path-to-regexp@8': '^8.4.0'
  'body-parser@2': '^2.4.0'
  'multer@2': '^2.5.0'
  'lodash@4': '^4.17.24'
  'axios@1': '^1.20.0'
  'systeminformation@5': '^5.31.7'
  '@grpc/grpc-js@1': '^1.14.5'
  'form-data@4': '^4.0.6'
  'js-yaml@4': '^4.3.2'
  'brace-expansion@2': '^2.1.7'
  'js-yaml@5': '^5.4.1'
